services:
  - type: web
    name: travelagent-ai-backend
    runtime: python
    rootDir: travel_agent_backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: open-mistral-nemo
